  <script>
   var userName = prompt("Enter your name:");

var age = Number(prompt("Enter your age:"));

var currentYear = Number(prompt("Enter current year:"));

var birthYear = currentYear - age;
alert("Hello " + userName + "! Your estimated birth year is " + birthYear);
  </script>
  
  <script>
   
var item1 = Number(prompt("Enter first item price:"));

var item2 = Number(prompt("Enter second item price:"));

var item3 = Number(prompt("Enter third item price:"));

var totalBill = item1 + item2 + item3;

var familyMembers = Number(prompt("Enter total family members:"));

var perPerson = totalBill / familyMembers;

alert("Total Bill: Rs. " + totalBill);

alert("Each Person Share: Rs. " + perPerson);

</script>

  <script>
    
var num1 = Number(prompt("Enter first number:"));

var num2 = Number(prompt("Enter second number:"));

var operator = prompt("Enter operator (+, -, *, /):");

var result;

if (operator == "+") {
    result = num1 + num2;
}
else if (operator == "-") {
    result = num1 - num2;
}
else if (operator == "*") {
    result = num1 * num2;
}
else if (operator == "/") {
    result = num1 / num2;
}
else {
    result = "Invalid Operator!";
}

alert("Your Answer is: " + result);

  </script>

  <script>
    var age = Number(prompt("Enter your age:"));

var student = prompt("Are you a student? (yes/no)");

var promoCode = prompt("Enter promo code:");

var ticketPrice = 500;

var finalPrice;

if (age < 12) {

    finalPrice = 0;

    alert("You got a free kids ticket!");

}
else {

    if (student == "yes") {

        finalPrice = ticketPrice - (ticketPrice * 20 / 100);

        alert("20% Student Discount Applied!");

    }
    else {

        finalPrice = ticketPrice;

    }

}

if (promoCode == "VIP123") {

    alert("Congratulations! You got a VIP Backstage Pass!");

}
else {

    alert("No VIP Pass.");

}

alert("Your final ticket price is Rs. " + finalPrice);

if (age >= 18 && student == "yes") {
    alert("Adult Student");
}
  </script>

<script>
  var hour = Number(prompt("Enter current hour (0-23):"));

if (hour >= 5 && hour < 12) {
    alert("Good Morning!");
}

else if (hour >= 12 && hour < 17) {
    alert("Good Afternoon!");
}

else if (hour >= 17 && hour <= 23) {
    alert("Good Evening / Good Night!");
}

else if (hour >= 0 && hour < 5) {
    alert("Good Evening / Good Night!");
}

else {
    alert("Invalid Hour! Please enter 0 to 23.");
}
</script>
  <script>
    
var score = 0;

var answer1 = prompt("Q1: Which planet is known as the Red Planet?\nA) Venus\nB) Mars\nC) Jupiter\nD) Saturn");

if (answer1.toLowerCase() == "b" || answer1.toLowerCase() == "mars") {
    score++;
    alert("Correct Answer!");
}
else {
    alert("Wrong Answer! Correct Answer is Mars.");
}


var answer2 = prompt("Q2: Who invented the World Wide Web?\nA) Bill Gates\nB) Steve Jobs\nC) Tim Berners-Lee\nD) Mark Zuckerberg");

if (answer2.toLowerCase() == "c" || answer2.toLowerCase() == "tim berners-lee") {
    score++;
    alert("Correct Answer!");
}
else {
    alert("Wrong Answer! Correct Answer is Tim Berners-Lee.");
}


var answer3 = prompt("Q3: What is the chemical symbol of Gold?\nA) Ag\nB) Au\nC) Fe\nD) Cu");

if (answer3.toLowerCase() == "b" || answer3.toLowerCase() == "au") {
    score++;
    alert("Correct Answer!");
}
else {
    alert("Wrong Answer! Correct Answer is Au.");
}


alert("Quiz Completed!\nYour Total Score: " + score + "/3");

if (score == 3) {
    alert("Grade: A\nExcellent Performance!");
}
else if (score == 2) {
    alert("Grade: B\nGood Performance!");
}
else if (score == 1) {
    alert("Grade: C\nYou Passed!");
}
else {
    alert("Grade: F\nYou Failed! Better Luck Next Time.");
}

  </script>
  <div id="result"></div>
  <script>
     var number = Number(prompt("Enter a number:"));

var range = Number(prompt("Enter table range:"));

var output = "";

output += "<h3>Multiplication Table of " + number + "</h3>";

for (var i = 1; i <= range; i++) {

    output += number + " x " + i + " = " + (number * i) + "<br>";

}

document.getElementById("result").innerHTML = output;

  </script>
